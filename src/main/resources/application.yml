server.port: 8989
server.servlet.context-path: /bank-api

spring.security.user.name: bankapp
spring.security.user.password: changeit

# The H2 web console is disabled by default. It is only enabled for local
# development through the `local` profile (see application-local.yml).
spring:
  h2:
    console:
      enabled: false
      settings:
        web-allow-others: false
